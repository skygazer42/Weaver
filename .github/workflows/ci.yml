name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Dependency sanity (pip check)
        run: python -m pip check

      - name: Compile (compileall)
        run: python -m compileall -q .

      - name: Export OpenAPI spec
        run: python scripts/export_openapi.py --output /tmp/weaver-openapi.json

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v7
        with:
          name: weaver-openapi-spec
          path: /tmp/weaver-openapi.json

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Lint (ruff, changed files)
        run: bash scripts/ruff_changed_files.sh

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weaver_test
          POSTGRES_PASSWORD: weaver_fixture_pw
          POSTGRES_DB: weaver_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U weaver_test -d weaver_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Download OpenAPI spec artifact
        uses: actions/download-artifact@v8
        with:
          name: weaver-openapi-spec
          path: .tmp/openapi

      - name: OpenAPI → TS types drift guard
        run: bash scripts/check_openapi_ts_types.sh --openapi-json .tmp/openapi/weaver-openapi.json

      - name: Lint (ESLint)
        run: pnpm -C web lint

      - name: Unit tests
        run: pnpm -C web test

      - name: Type check
        run: pnpm -C web exec tsc --noEmit

      - name: Build (next build)
        run: pnpm -C web build

      - name: Set up Python for browser tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Playwright Chromium
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm -C web e2e

      - name: PostgreSQL integration and project browser E2E
        env:
          WEAVER_TEST_POSTGRES_DSN: postgresql://weaver_test:weaver_fixture_pw@127.0.0.1:${{ job.services.postgres.ports[5432] }}/weaver_test
          WEAVER_PROJECT_BROWSER_E2E: "1"
          ENABLE_FILE_LOGGING: "false"
        run: >-
          python -m pytest -q
          tests/test_run_journal.py tests/test_durable_runtime.py
          tests/test_project_task_runtime.py tests/test_project_browser.py

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: weaver-browser-failures
          path: web/test-results/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -f docker/Dockerfile .

  benchmark_smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run benchmark smoke
        run: |
          python scripts/benchmark_deep_research.py \
            --max-cases 3 \
            --mode auto \
            --output /tmp/benchmark_smoke.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke-report
          path: /tmp/benchmark_smoke.json
